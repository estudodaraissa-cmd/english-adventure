<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost in Translation — English Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* MANTENDO TODO O SEU DESIGN LINDO */
  :root {
    --ink: #1a1410; --paper: #f5f0e8; --cream: #ede8dc;
    --accent: #c9411a; --gold: #d4a843; --muted: #8a7f72;
    --correct: #2d6a4f; --wrong: #9b2226;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events: none; z-index: 1000; opacity: 0.6; }
  .screen { display: none; min-height: 100vh; animation: fadeIn 0.6s ease forwards; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  #cover { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  .cover-left { background: var(--ink); color: var(--paper); padding: 60px 50px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
  .cover-tag { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
  .cover-title { font-family: 'Playfair Display', serif; font-size: clamp(48px, 6vw, 80px); font-weight: 900; line-height: 0.95; margin: 40px 0 20px; }
  .cover-title em { font-style: italic; color: var(--gold); }
  #player-name { display: block; width: 100%; max-width: 340px; padding: 16px; margin-bottom: 15px; border: 1px solid rgba(212,168,67,0.4); background: rgba(255,255,255,0.05); color: white; font-family: 'DM Mono', monospace; }
  .cover-btn { background: var(--accent); color: white; padding: 16px 28px; font-family: 'DM Mono', monospace; border: none; cursor: pointer; }
  .cover-right { background: var(--cream); display: flex; justify-content: center; align-items: center; }
  .city-illustration { font-size: 120px; animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  #question-screen { max-width: 780px; margin: 0 auto; padding: 40px 24px 80px; }
  .progress-bar { height: 3px; background: rgba(26,20,16,0.1); margin-bottom: 30px; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.5s; }
  .story-card { background: var(--ink); color: var(--paper); padding: 40px 44px; margin-bottom: 32px; border-top: 3px solid var(--accent); }
  .option-btn { background: white; border: 1.5px solid rgba(26,20,16,0.12); padding: 18px 22px; text-align: left; cursor: pointer; width: 100%; margin-bottom: 10px; font-family: inherit; font-size: 15px; transition: 0.2s; }
  .option-btn.correct { background: #f0faf4; border-color: var(--correct); }
  .option-btn.wrong { background: #fdf0f0; border-color: var(--wrong); }
  .feedback-box { display: none; padding: 20px; margin-top: 20px; border-left: 4px solid var(--correct); background: #f0faf4; }
  .feedback-box.show { display: block; }
  .feedback-box.wrong-fb { border-color: var(--wrong); background: #fdf0f0; }
  .next-btn { background: var(--ink); color: var(--paper); padding: 14px 26px; border: none; cursor: pointer; display: none; margin-top: 20px; font-family: 'DM Mono', monospace; }
  .next-btn.show { display: inline-flex; }
  #result-screen { text-align: center; padding: 80px 20px; }
  .result-score { font-size: 80px; font-weight: 900; color: var(--gold); font-family: 'Playfair Display', serif; }
</style>
</head>
<body>

<div id="cover" class="screen active">
  <div class="cover-left">
    <div><div class="cover-tag">✦ English Adventure</div></div>
    <div>
      <h1 class="cover-title">Lost in<br><em>Translation</em></h1>
      <input type="text" id="player-name" placeholder="Enter your name to start...">
      <button class="cover-btn" onclick="startGame()">Begin the Journey →</button>
    </div>
  </div>
  <div class="cover-right"><div class="city-illustration">🌍</div></div>
</div>

<div id="question-screen" class="screen">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="story-card">
    <div id="q-location" style="color: var(--gold); font-family: 'DM Mono'; font-size: 10px; letter-spacing: 2px; margin-bottom: 10px;"></div>
    <div id="q-story" style="font-family: 'Playfair Display'; font-size: 24px; font-style: italic; margin-bottom: 15px;"></div>
    <div id="q-question" style="font-weight: bold; font-size: 18px;"></div>
  </div>
  <div class="options" id="options-container"></div>
  <div class="feedback-box" id="feedback-box">
    <div id="fb-headline" style="font-weight: bold; margin-bottom: 5px;"></div>
    <div id="fb-text" style="font-size: 14px; line-height: 1.5;"></div>
  </div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">Continue the story →</button>
</div>

<div id="result-screen" class="screen">
  <div class="result-tag">✦ End of Journey</div>
  <div id="result-name" style="font-size: 24px; margin-top: 20px;"></div>
  <div class="result-score" id="result-final-score"></div>
  <p>The journey is complete. Your results were sent to the instructors.</p>
  <button class="cover-btn" style="margin-top: 30px;" onclick="location.reload()">Try again</button>
</div>

<script>
const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbyvuSFNGkDeJ4Re6JqMt_jjuNZliXzfY1_UKKID64fSdG0bdOzpQ54GsAKyx3bUJFeI/exec";

const questions = [
  {
    location: "📍 Airport Arrivals Hall",
    story: "You step off the plane. A friendly local approaches, hand extended, smiling.",
    question: "You've never met her. How do you introduce yourself?",
    options: [
      { text: "I am Maria. I from Brazil.", correct: false },
      { text: "My name is Maria. I'm from Brazil.", correct: true },
      { text: "I'm Maria and I come from Brazil.", correct: true },
      { text: "Maria. Brazil.", correct: false }
    ],
    feedback_correct: { headline: "She smiles warmly. ✓", text: "A clean, natural introduction. She offers to help you find the exit — your adventure begins on a high note." },
    feedback_wrong: { headline: "She looks a little confused. ✗", text: "Something didn't land right. Tip: always use 'My name is...' or 'I'm...' and pair it with 'I'm from [country].'" }
  },
  {
    location: "📍 Hotel Check-In",
    story: "The receptionist slides a form across and asks for your wake-up call time.",
    question: "\"What time do you usually wake up?\"",
    options: [
      { text: "I wake up 7 o'clock.", correct: false },
      { text: "I waking up at 7.", correct: false },
      { text: "I wake up at 7 o'clock.", correct: true },
      { text: "I'm wake up 7.", correct: false }
    ],
    feedback_correct: { headline: "Room 412, all yours. ✓", text: "Perfect. The receptionist notes it down. The little word 'at' makes all the difference with times." },
    feedback_wrong: { headline: "She asks you to repeat. ✗", text: "Close! Remember: it's 'wake up AT 7 o'clock' — and the present simple form 'wake up'." }
  },
  {
    location: "📍 Hotel Corridor",
    story: "A fellow traveler is curious about your day so far.",
    question: "\"What did you do yesterday?\"",
    options: [
      { text: "I go to work yesterday.", correct: false },
      { text: "I went to work.", correct: true },
      { text: "I was go to work.", correct: false },
      { text: "Yesterday I going work.", correct: false }
    ],
    feedback_correct: { headline: "She nods, impressed. ✓", text: "'Went' — the irregular past of 'go'. Clean and confident." },
    feedback_wrong: { headline: "She tilts her head. ✗", text: "'Go' becomes 'went' in the past. You never say 'I go' or 'I going' for past events." }
  },
  {
    location: "📍 Street Food Corner",
    story: "A classic burger place. You're starving and the counter person is waiting.",
    question: "How do you order?",
    options: [
      { text: "I want hamburger and coke.", correct: false },
      { text: "Want hamburger.", correct: false },
      { text: "I'd like a hamburger and a coke, please.", correct: true },
      { text: "Give me hamburger.", correct: false }
    ],
    feedback_correct: { headline: "\"Coming right up!\" ✓", text: "'I'd like...' is the gold standard for polite requests." },
    feedback_wrong: { headline: "The person looked surprised. ✗", text: "In English culture, directness without politeness can be rude. Try 'I'd like a [item], please.'" }
  },
  {
    location: "📍 City Square",
    story: "You got separated from the group. A local offers to help.",
    question: "What do you ask to get their phone number?",
    options: [
      { text: "You number?", correct: false },
      { text: "What your phone number?", correct: false },
      { text: "What is your phone number?", correct: true },
      { text: "Your phone number what?", correct: false }
    ],
    feedback_correct: { headline: "She types it in your phone. ✓", text: "Textbook question structure! This is the backbone of English." },
    feedback_wrong: { headline: "She understood — but barely. ✗", text: "English questions need a verb! 'What IS your phone number?'" }
  },
  {
    location: "📍 Café Terrace",
    story: "Someone offers you coffee, but you absolutely cannot stand it.",
    question: "How do you decline?",
    options: [
      { text: "I no like coffee.", correct: false },
      { text: "I not like coffee.", correct: false },
      { text: "I don't like coffee.", correct: true },
      { text: "No coffee for me.", correct: false }
    ],
    feedback_correct: { headline: "He laughs and pours himself a cup. ✓", text: "Perfect negative construction: 'I DON'T like'." },
    feedback_wrong: { headline: "He poured it anyway. ✗", text: "In the present simple, you always need the auxiliary: 'I don't like'." }
  },
  {
    location: "📍 Hostel Common Room",
    story: "New friends are throwing a party Saturday night.",
    question: "\"Are you coming to the party on Saturday?\"",
    options: [
      { text: "Yes, I come.", correct: false },
      { text: "Yes, I coming.", correct: false },
      { text: "Yes, I'll come! / Yes, I'm going to come!", correct: true },
      { text: "Yes, Saturday I go.", correct: false }
    ],
    feedback_correct: { headline: "\"Yes! See you there!\" ✓", text: "Correct ways to express the future: 'will come' or 'going to come'." },
    feedback_wrong: { headline: "They looked unsure if you said yes. ✗", text: "Use 'I'll come' or 'I'm going to come' for future intentions." }
  },
  {
    location: "📍 Hotel Gym",
    story: "A trainer strikes up a conversation about habits.",
    question: "\"How often do you exercise?\"",
    options: [
      { text: "I exercise two times week.", correct: false },
      { text: "I exercise twice a week.", correct: true },
      { text: "Two times I exercise.", correct: false },
      { text: "I exercising twice.", correct: false }
    ],
    feedback_correct: { headline: "\"Impressive consistency!\" ✓", text: "'Twice a week' is the natural, fluent way." },
    feedback_wrong: { headline: "He wasn't sure what you meant. ✗", text: "The correct form is 'I exercise twice a week.' Don't forget 'a' before the time period." }
  },
  {
    location: "📍 Your Hotel Room",
    story: "Your mom asks where your phone is on a video call.",
    question: "\"Where's your phone?\"",
    options: [
      { text: "It's in the table.", correct: false },
      { text: "It's on the table.", correct: true },
      { text: "It's the table.", correct: false },
      { text: "Table it's.", correct: false }
    ],
    feedback_correct: { headline: "\"Got it, I see it!\" ✓", text: "ON the table — for surfaces, we always use 'on'." },
    feedback_wrong: { headline: "\"What? I can't understand you.\" ✗", text: "Use 'ON' for surfaces. 'In the table' would mean inside it." }
  },
  {
    location: "📍 Rooftop Bar",
    story: "Maria says she loves her job, but really hates waking up early.",
    question: "Which of these is TRUE about Maria?",
    options: [
      { text: "Maria works in Rio.", correct: false },
      { text: "Maria hates her job.", correct: false },
      { text: "Maria loves her job.", correct: true },
      { text: "Maria loves waking up early.", correct: false }
    ],
    feedback_correct: { headline: "You understood perfectly. ✓", text: "Reading carefully means catching the contrast!" },
    feedback_wrong: { headline: "You mixed something up. ✗", text: "She likes her job, but dislikes early mornings. Every word counts." }
  }
];

let current = 0, score = 0, playerName = "", detailedAnswers = [];

function startGame() {
  playerName = document.getElementById('player-name').value;
  if(!playerName) return alert("Please enter your name!");
  document.getElementById('cover').classList.remove('active');
  document.getElementById('question-screen').classList.add('active');
  showQuestion();
}

function showQuestion() {
  const q = questions[current];
  document.getElementById('progress-fill').style.width = `${((current + 1) / questions.length) * 100}%`;
  document.getElementById('q-location').textContent = q.location;
  document.getElementById('q-story').textContent = q.story;
  document.getElementById('q-question').textContent = q.question;
  const container = document.getElementById('options-container');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span>${opt.text}</span>`;
    btn.onclick = () => selectAnswer(i, opt.correct);
    container.appendChild(btn);
  });
  document.getElementById('feedback-box').classList.remove('show', 'wrong-fb');
  document.getElementById('next-btn').classList.remove('show');
}

function selectAnswer(index, isCorrect) {
  const q = questions[current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  if (isCorrect) {
    btns[index].classList.add('correct');
    score++; detailedAnswers.push(1);
    showFeedback(q.feedback_correct, false);
  } else {
    btns[index].classList.add('wrong');
    detailedAnswers.push(0);
    showFeedback(q.feedback_wrong, true);
  }
  document.getElementById('next-btn').classList.add('show');
}

function showFeedback(fb, isWrong) {
  const box = document.getElementById('feedback-box');
  document.getElementById('fb-headline').textContent = fb.headline;
  document.getElementById('fb-text').textContent = fb.text;
  if (isWrong) box.classList.add('wrong-fb');
  box.classList.add('show');
}

function nextQuestion() {
  current++;
  if (current >= questions.length) return showResult();
  showQuestion();
}

function showResult() {
  document.getElementById('question-screen').classList.remove('active');
  document.getElementById('result-screen').classList.add('active');
  document.getElementById('result-name').textContent = `Congratulations, ${playerName}!`;
  document.getElementById('result-final-score').textContent = `${score}/${questions.length}`;

  fetch(URL_GOOGLE_SHEETS, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({ name: playerName, score: score, answers: detailedAnswers.join(",") })
  });
}
</script>
</body>
</html>
